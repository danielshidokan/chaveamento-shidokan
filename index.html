<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso restrito</title>
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;min-height:100vh;background:radial-gradient(1000px 560px at 50% -12%,#4e3770 0,transparent 62%),radial-gradient(700px 500px at 100% 110%,#2b1a52 0,transparent 60%),linear-gradient(#1a1230,#0d0919);color:#efeaf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{width:min(400px,92vw);padding:28px 26px 24px;border:1px solid rgba(184,160,89,.38);border-radius:18px;background:rgba(78,55,112,.28);box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}
.logo{display:block;width:132px;height:132px;margin:-4px auto 10px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55))}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.18em;color:#d2bc72}
p{margin:0 0 18px;color:#b9aed2;font-size:13px}
input[type=password],input[type=text]{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid rgba(184,160,89,.35);background:rgba(10,6,22,.55);color:inherit;font:inherit;text-align:center}
input:focus{outline:2px solid #b8a059;border-color:transparent}
button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:#8d6fb8;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:hover:not(:disabled){background:#a083cc}
button:disabled{opacity:.6;cursor:wait}
label{display:block;margin-top:10px;color:#b9aed2;font-size:12px;cursor:pointer}
#msg{min-height:18px;margin-top:12px;font-size:13px;color:#fca5a5}
#msg.ok{color:#b9aed2}

body{display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.box{margin:auto;box-sizing:border-box;width:min(454px,92vw)}
.foot{width:100%;box-sizing:border-box;margin-top:auto;padding:20px 18px 26px;text-align:center;color:#fff;font-weight:700;font-size:18px;line-height:1.45;text-shadow:0 0 12px rgba(255,255,255,.35);overflow:hidden}
.foot span{display:block;animation:pulso 2.2s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
</style>
</head>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function deriveKey(password,salt,iter,usage){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,[usage]);
}
async function decryptHtml(pkg,password){
  const key=await deriveKey(password,unb64(pkg.s),pkg.n,'decrypt');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pkg.i)},key,unb64(pkg.d));
  return new TextDecoder().decode(pt);
}
const pkg=JSON.parse($('#pkg').textContent);
$('#show').onchange=e=>{$('#pw').type=e.target.checked?'text':'password';};
if(!(window.crypto&&crypto.subtle)){
  $('#msg').textContent='Este navegador não consegue verificar a senha. Use o Chrome ou o Firefox atualizados.';
  $('#go').disabled=true;
}
$('#f').onsubmit=async e=>{
  e.preventDefault();
  const pw=$('#pw').value,msg=$('#msg'),go=$('#go');
  if(!pw)return;
  go.disabled=true;msg.className='ok';msg.textContent='Verificando...';
  try{
    const html=await decryptHtml(pkg,pw);
    document.open();document.write(html);document.close();
  }catch(err){
    msg.className='';msg.textContent='Senha incorreta ou arquivo danificado.';
    go.disabled=false;$('#pw').select();
  }
};
})();
</script>
